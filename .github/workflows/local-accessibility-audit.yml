name: Full Accessibility Audit
on:
  push:
    branches: [local-vite-app]

env:
  # provide the correct port for your local server
  APP_PORT: 5173
  # provide the correct port and host flags for your local server
  START_COMMAND: "npx vite --port 5173 --host"
  AUDIT_IMAGE: ghcr.io/stackoverflowisbetterthananyai/full-accessibility-audit:latest

jobs:
  Full_Accessibility_Audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Start App
        run: |
          npm ci
          $START_COMMAND &
          npx wait-on http://localhost:$APP_PORT --timeout 60000

      - name: Run Full Accessibility Audit via GHCR Image
        run: |
          mkdir -p reports
          cp cypress/fixtures/sitemap.json reports/sitemap.json || echo '{"config": {"included": [], "excluded": []}, "urls": []}' > reports/sitemap.json

          GATEWAY_IP=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')

          docker run --rm \
            --ipc=host \
            -e CYPRESS_BASE_URL="http://$GATEWAY_IP:$APP_PORT" \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/reports:/app/cypress/fixtures \
            $AUDIT_IMAGE \
            sh -c "
              echo 'Waiting for connection to $GATEWAY_IP:$APP_PORT' && \
              npx wait-on http://$GATEWAY_IP:$APP_PORT --timeout 60000 && \
              npm run cy:run-crawler && \
              npm run cy:run-audit
            "

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-accessibility-reports
          path: reports/
