name: Full Accessibility Audit Alfa

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "24"
        description: "node.js version to use"

      app_port:
        required: true
        type: string
        description: "provide the correct port for your local server"

      start_command:
        required: true
        type: string
        description: "provide the command to start your local server with the correct port and host flags"

      skip_crawler:
        required: false
        type: boolean
        default: false
        description: "skip crawler and run audit directly"

jobs:
  Full_Accessibility_Audit_Alfa:
    name: Full Accessibility Audit Alfa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Client-App
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Start App
        run: |
          npm ci
          ${{ inputs.start_command }} &
          npx wait-on http://localhost:${{ inputs.app_port }} --timeout 60000

      - name: Run Full Accessibility Audit Alfa via GHCR Image
        run: |
          mkdir -p audit
          cp cypress/fixtures/sitemap.json audit/sitemap.json || echo '{"config": {"only": [], "included": [], "excluded": []}, "urls": []}' > audit/sitemap.json

          GATEWAY_IP=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')

          if [ "${{ inputs.skip_crawler }}" = "true" ]; then
            AUDIT_COMMAND="npm run cy:run-audit"
          else
            AUDIT_COMMAND="npm run cy:run-crawler && npm run cy:run-audit"
          fi

          docker run --rm \
            --ipc=host \
            -e CYPRESS_BASE_URL="http://$GATEWAY_IP:${{ inputs.app_port }}" \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/audit:/app/cypress/fixtures \
            ghcr.io/stackoverflowisbetterthananyai/full-accessibility-audit:alfa \
            sh -c "
              npx wait-on http://$GATEWAY_IP:${{ inputs.app_port }} --timeout 60000 && \
              $AUDIT_COMMAND
            "

      - name: Upload Audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-accessibility-audit-alfa
          path: audit/
