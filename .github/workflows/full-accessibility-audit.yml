name: Full Accessibility Audit
on: [push, pull_request]

env:
  # provide the correct port for your local server
  APP_PORT: 5173
  # provide the correct port and host flags for your local server
  START_COMMAND: "npx vite --port 5173 --host"
  AUDIT_IMAGE: ghcr.io/stackoverflowisbetterthananyai/full-accessibility-audit:latest

jobs:
  Full_Accessibility_Audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start App
        run: |
          npm ci
          $START_COMMAND &
          npx wait-on http://localhost:$APP_PORT --timeout 60000

      - name: Run Full Accessibility Audit from Registry
        run: |
          mkdir -p reports
          cp cypress/fixtures/sitemap.json reports/sitemap.json || echo "{}" > reports/sitemap.json

          GATEWAY_IP=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')

          docker run --rm \
            --ipc=host \
            -e CYPRESS_BASE_URL="http://$GATEWAY_IP:$APP_PORT" \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/reports:/app/cypress/fixtures \
            $AUDIT_IMAGE \
            sh -c "
              npx wait-on http://$GATEWAY_IP:$APP_PORT --timeout 60000 && \
              npm run cy:run-crawler && \
              npm run cy:run-audit
            "

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-accessibility-reports
          path: reports/
